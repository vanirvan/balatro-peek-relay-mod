<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peek Deck — Balatro Viewer</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hud-bar">
        <div class="hud-item">
          <span class="hud-label">SEED</span>
          <span id="val-seed" class="hud-val font-mono">--------</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">ANTE</span>
          <span id="val-ante" class="hud-val">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">BLIND</span>
          <span id="val-blind" class="hud-val highlight">None</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">HANDS</span>
          <span id="val-hands" class="hud-val">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">DISCARDS</span>
          <span id="val-discards" class="hud-val">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">DECK</span>
          <span id="val-deck-size" class="hud-val">0</span>
        </div>
      </header>

      <!-- Jokers & Consumables Row -->
      <div class="top-cards-row">
        <section class="section-container jokers-section">
          <div class="section-header">
            <h2>JOKERS</h2>
            <span id="jokers-count" class="count-badge">0 cards</span>
          </div>
          <div id="jokers-list" class="card-grid special-grid">
            <div class="empty-state">No Jokers</div>
          </div>
        </section>

        <section class="section-container consumables-section">
          <div class="section-header">
            <h2>CONSUMABLES</h2>
            <span id="consumables-count" class="count-badge">0 cards</span>
          </div>
          <div id="consumables-list" class="card-grid special-grid">
            <div class="empty-state">No Consumables</div>
          </div>
        </section>
      </div>

      <section class="section-container">
        <div class="section-header">
          <div class="hand-header-left">
            <h2>CURRENT HAND</h2>
            <div id="scoring-hand-banner" class="scoring-banner hidden">
              <span id="scoring-hand-name" class="scoring-name">High Card</span>
              <span id="scoring-hand-lvl" class="scoring-lvl">lvl.1</span>
              <span id="scoring-hand-score" class="scoring-score">
                <span id="scoring-chips" class="score-chips">5</span> × <span id="scoring-mult" class="score-mult">1</span>
              </span>
            </div>
          </div>
          <span id="hand-count" class="count-badge">0 cards</span>
        </div>
        <div id="hand-list" class="card-grid hand-grid">
          <div class="empty-state">No cards in hand</div>
        </div>
      </section>

      <section id="draw-pile-section" class="section-container draw-pile-section">
        <div class="section-header">
          <h2>DRAW PILE <span class="subtext">(next drawn cards in order)</span></h2>
          <div class="section-actions">
            <span id="pile-count" class="count-badge">0 cards</span>
            <button
              id="draw-pile-toggle"
              class="collapse-btn"
              type="button"
              aria-expanded="true"
              aria-controls="draw-pile-list"
              title="Collapse Draw Pile"
            >
              <svg class="collapse-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
              <span class="collapse-label">Collapse</span>
            </button>
          </div>
        </div>
        <div id="draw-pile-list" class="card-grid">
          <div class="empty-state">Waiting for Balatro run data...</div>
        </div>
      </section>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
